name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: els_test
          POSTGRES_USER: els
          POSTGRES_PASSWORD: els_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U els -d els_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: go mod download && go mod verify
        working-directory: services/api
      - name: Unit, migration and concurrent database integration tests
        run: go test -race -count=1 -v ./...
        working-directory: services/api
        env:
          TEST_DATABASE_URL: postgres://els:els_ci_only@127.0.0.1:5432/els_test?sslmode=disable
      - run: go vet ./... && go build ./cmd/api
        working-directory: services/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm test && npm run build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  integration:
    env:
      ELS_ADMIN_USERNAME: admin
      ELS_ADMIN_PASSWORD: els-ci-disposable-password-only
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start complete development stack
        run: docker compose up --build -d
      - name: Wait for API and web readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/api/v1/health >/dev/null \
              && curl --silent --fail http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 3
          done
          test "$ready" -eq 1
      - run: python3 scripts/smoke.py
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop disposable CI stack
        if: always()
        run: docker compose down -v
