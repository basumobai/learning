# Optional dedicated service: pin CODEX_VERSION and authenticate it separately.
services:
  api:
    environment:
      LEARNING_CODEX_RUNNER_URL: http://codex-runner:8090
      LEARNING_CODEX_RUNNER_TOKEN: ${LEARNING_CODEX_RUNNER_TOKEN:?Set a random shared token}
  codex-runner:
    build:
      context: .
      dockerfile: services/codex-runner/Dockerfile
      args:
        CODEX_VERSION: ${CODEX_VERSION:?Pin an installed compatible Codex CLI version}
    environment:
      LEARNING_CODEX_RUNNER_TOKEN: ${LEARNING_CODEX_RUNNER_TOKEN}
      CODEX_HOME: /codex
    volumes:
      - codex_auth:/codex
    tmpfs:
      - /tmp:size=256m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
volumes:
  codex_auth:
