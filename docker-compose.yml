services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: els
      POSTGRES_USER: els
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-els_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U els -d els"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment: &api_environment
      REDIS_URL: redis://redis:6379/0
      LEARNING_EMBEDDED_WORKER: "false"
      LEARNING_V3_SCORING: ${LEARNING_V3_SCORING:-false}
      DATABASE_URL: postgres://els:${POSTGRES_PASSWORD:-els_local_only}@postgres:5432/els?sslmode=disable
      ADDR: :8080
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Run bash scripts/install.sh to create the encryption key}
      ELS_ADMIN_USERNAME: ${ELS_ADMIN_USERNAME:-admin}
      ELS_ADMIN_PASSWORD: ${ELS_ADMIN_PASSWORD:?Set a strong initial administrator password in .env}
      LEARNING_PDF_DIR: /data/pdf
      LEARNING_PDF_HOST_DIR: ${LEARNING_PDF_DIR:-./data/pdf}
    volumes:
      - ${LEARNING_PDF_DIR:-./data/pdf}:/data/pdf:ro
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 5
  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["/app/els", "worker"]
    environment: *api_environment
    volumes:
      - ${LEARNING_PDF_DIR:-./data/pdf}:/data/pdf:ro
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/els", "worker-health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    mem_limit: 768m
    pids_limit: 128
  web:
    restart: unless-stopped
    build:
      context: apps/web
    environment:
      API_INTERNAL_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/v1/health"]
      interval: 15s
      timeout: 4s
      start_period: 30s
      retries: 5
volumes:
  postgres_data:
