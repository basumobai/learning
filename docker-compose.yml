services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: els
      POSTGRES_USER: els
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-els_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U els -d els"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgres://els:${POSTGRES_PASSWORD:-els_local_only}@postgres:5432/els?sslmode=disable
      ADDR: :8080
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Run bash scripts/install.sh to create the encryption key}
      ELS_ADMIN_USERNAME: ${ELS_ADMIN_USERNAME:-admin}
      ELS_ADMIN_PASSWORD: ${ELS_ADMIN_PASSWORD:?Set a strong initial administrator password in .env}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  web:
    build:
      context: apps/web
    environment:
      API_INTERNAL_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api
volumes:
  postgres_data:
